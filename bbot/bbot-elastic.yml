name: BBOT Elasticsearch output
description: Send every BBOT event to the BBOT Dashboard stack

output_modules:
  - elastic

config:
  modules:
    elastic:
      # Replace SERVER_IP when BBOT runs on a different machine.
      # op_type=index lets the ingest pipeline replace duplicate DNS events.
      url: http://SERVER_IP:9200/bbot-events-000001/_doc?op_type=index
      username: bbot
      password: bbotbbot

